<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひとこと — あなただけのSNS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0e0e0f;
      --surface: #18181b;
      --surface2: #222226;
      --border: #2e2e34;
      --accent: #7fff6e;
      --accent2: #6ee0ff;
      --text: #f0f0f0;
      --muted: #888;
      --danger: #ff6e6e;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      min-height: 100vh;
    }

    /* ── Auth Screen ── */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      gap: 32px;
    }

    .auth-logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }
    .auth-logo span { color: var(--accent); }

    .auth-tagline {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0a0a0a;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .msg {
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
    }
    .msg.error { background: #3a1a1a; color: var(--danger); display: block; }
    .msg.success { background: #1a3a1a; color: var(--accent); display: block; }

    /* ── App Screen ── */
    #app-screen { display: none; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14,14,15,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .header-logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 5px 10px;
      transition: all 0.2s;
    }
    .btn-logout:hover { color: var(--text); border-color: var(--text); }

    .app-body {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Compose */
    .compose-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .compose-textarea {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      resize: none;
      width: 100%;
      min-height: 72px;
      line-height: 1.6;
    }
    .compose-textarea::placeholder { color: var(--muted); }

    .compose-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .char-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .char-count.warn { color: #ffb86e; }
    .char-count.over { color: var(--danger); }

    .btn-post {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0a0a0a;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 20px;
      transition: opacity 0.2s;
    }
    .btn-post:hover { opacity: 0.88; }
    .btn-post:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Feed */
    .feed-header {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent2);
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .post-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .post-username {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .post-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .post-body {
      font-size: 0.97rem;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-like {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .btn-like:hover { color: var(--danger); }
    .btn-like.liked { color: var(--danger); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 0;
      margin-left: auto;
      transition: color 0.2s;
    }
    .btn-delete:hover { color: var(--danger); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 32px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
    }

    /* Setup banner */
    .setup-banner {
      background: #1a1a2e;
      border: 1px solid #3a3a6e;
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 0.85rem;
      color: var(--accent2);
      display: none;
    }
    .setup-banner code {
      background: var(--bg);
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="auth-screen">
  <div class="auth-logo">ひとこと<span>.</span></div>
  <p class="auth-tagline">友達だけの、小さなSNS</p>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">ログイン</button>
      <button class="auth-tab" onclick="switchTab('signup')">新規登録</button>
    </div>

    <div id="login-form">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="form-group" style="margin-top:12px">
        <label>パスワード</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <div id="login-msg" class="msg"></div>
      <button class="btn-primary" style="margin-top:8px" onclick="login()">ログイン</button>
    </div>

    <div id="signup-form" style="display:none">
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" id="signup-name" placeholder="yourname" maxlength="20">
      </div>
      <div class="form-group" style="margin-top:12px">
        <label>メールアドレス</label>
        <input type="email" id="signup-email" placeholder="you@example.com">
      </div>
      <div class="form-group" style="margin-top:12px">
        <label>パスワード（6文字以上）</label>
        <input type="password" id="signup-pass" placeholder="••••••••">
      </div>
      <div id="signup-msg" class="msg"></div>
      <button class="btn-primary" style="margin-top:8px" onclick="signup()">登録する</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app-screen">
  <header class="app-header">
    <div class="header-logo">ひとこと<span>.</span></div>
    <div class="header-right">
      <div class="avatar" id="user-avatar">?</div>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <div class="app-body">
    <div class="setup-banner" id="setup-banner">
      ⚙️ <strong>Supabaseの設定が必要です。</strong><br>
      下のREADMEを参考に <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を設定してください。
    </div>

    <div class="compose-box">
      <textarea
        class="compose-textarea"
        id="post-text"
        placeholder="いまどうしてる？"
        maxlength="280"
        oninput="updateCharCount()"
      ></textarea>
      <div class="compose-footer">
        <span class="char-count" id="char-count">0 / 280</span>
        <button class="btn-post" id="post-btn" onclick="submitPost()" disabled>投稿</button>
      </div>
    </div>

    <div class="feed-header">タイムライン</div>

    <div class="posts-list" id="posts-list">
      <div class="loading">読み込み中...</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  設定 — SupabaseのURLとキーをここに入力
// ══════════════════════════════════════
const SUPABASE_URL  = 'https://mwxszobzojshmxudkqyw.supabase.co';
　const SUPABASE_ANON = 'sb_publishable_mmcEZBnVOux_5hQK9Nvy9g_9iF7BGeH';
// ══════════════════════════════════════

const { createClient } = supabase;
let sb, currentUser;

function initSupabase() {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') return false;
  sb = createClient(SUPABASE_URL, SUPABASE_ANON);
  return true;
}

// ── Tab switch ──
function switchTab(tab) {
  document.getElementById('login-form').style.display  = tab === 'login'  ? '' : 'none';
  document.getElementById('signup-form').style.display = tab === 'signup' ? '' : 'none';
  document.querySelectorAll('.auth-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
  });
}

// ── Auth ──
async function signup() {
  if (!initSupabase()) return alert('Supabaseの設定をしてください');
  const name  = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pass  = document.getElementById('signup-pass').value;
  const msg   = document.getElementById('signup-msg');
  if (!name || !email || !pass) { showMsg(msg, 'error', 'すべて入力してください'); return; }
  if (pass.length < 6) { showMsg(msg, 'error', 'パスワードは6文字以上です'); return; }
  const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { username: name } } });
  if (error) { showMsg(msg, 'error', error.message); return; }
  // 登録成功後は自動ログインせず、ログイン画面に誘導
  await sb.auth.signOut();
  showMsg(msg, 'success', '登録完了！ログインタブからログインしてください。');
  setTimeout(() => switchTab('login'), 1800);
}

async function login() {
  if (!initSupabase()) return alert('Supabaseの設定をしてください');
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const msg   = document.getElementById('login-msg');
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { showMsg(msg, 'error', 'メールアドレスまたはパスワードが違います'); return; }
}

async function logout() {
  await sb.auth.signOut();
  showAuthScreen();
}

function showMsg(el, type, text) {
  el.className = 'msg ' + type;
  el.textContent = text;
}

// ── Screen switch ──
function showAuthScreen() {
  document.getElementById('auth-screen').style.display = '';
  document.getElementById('app-screen').style.display  = 'none';
}

function showAppScreen(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display  = '';
  const name = user.user_metadata?.username || user.email.split('@')[0];
  document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
  loadPosts();
  subscribeRealtime();
}

// ── Posts ──
async function loadPosts() {
  const list = document.getElementById('posts-list');
  const { data, error } = await sb
    .from('posts')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) { list.innerHTML = '<div class="empty-state">投稿の読み込みに失敗しました</div>'; return; }
  renderPosts(data);
}

function renderPosts(posts) {
  const list = document.getElementById('posts-list');
  if (!posts.length) {
    list.innerHTML = '<div class="empty-state">まだ投稿がありません。最初の投稿をしよう！</div>';
    return;
  }
  list.innerHTML = posts.map(p => postHTML(p)).join('');
}

function postHTML(p) {
  const name    = p.username || '名無し';
  const initial = name.charAt(0).toUpperCase();
  const time    = formatTime(p.created_at);
  const isOwn   = currentUser && p.user_id === currentUser.id;
  const liked   = (p.liked_by || []).includes(currentUser?.id);
  const likeCount = (p.liked_by || []).length;

  return `
  <div class="post-card" id="post-${p.id}">
    <div class="post-header">
      <div class="post-avatar">${initial}</div>
      <div class="post-meta">
        <div class="post-username">${escHtml(name)}</div>
        <div class="post-time">${time}</div>
      </div>
    </div>
    <div class="post-body">${escHtml(p.content)}</div>
    <div class="post-actions">
      <button class="btn-like ${liked ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${liked})">
        ${liked ? '♥' : '♡'} ${likeCount}
      </button>
      ${isOwn ? `<button class="btn-delete" onclick="deletePost('${p.id}')">削除</button>` : ''}
    </div>
  </div>`;
}

async function submitPost() {
  const ta  = document.getElementById('post-text');
  const btn = document.getElementById('post-btn');
  const text = ta.value.trim();
  if (!text || text.length > 280) return;
  btn.disabled = true;
  const name = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
  const { error } = await sb.from('posts').insert({
    user_id: currentUser.id,
    username: name,
    content: text,
    liked_by: []
  });
  if (!error) { ta.value = ''; updateCharCount(); }
  btn.disabled = false;
}

async function toggleLike(postId, currentlyLiked) {
  const { data: post } = await sb.from('posts').select('liked_by').eq('id', postId).single();
  let liked_by = post.liked_by || [];
  if (currentlyLiked) {
    liked_by = liked_by.filter(id => id !== currentUser.id);
  } else {
    if (!liked_by.includes(currentUser.id)) liked_by.push(currentUser.id);
  }
  await sb.from('posts').update({ liked_by }).eq('id', postId);
}

async function deletePost(postId) {
  if (!confirm('この投稿を削除しますか？')) return;
  await sb.from('posts').delete().eq('id', postId);
}

// ── Realtime ──
function subscribeRealtime() {
  sb.channel('posts')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadPosts())
    .subscribe();
}

// ── Helpers ──
function updateCharCount() {
  const ta   = document.getElementById('post-text');
  const el   = document.getElementById('char-count');
  const btn  = document.getElementById('post-btn');
  const len  = ta.value.length;
  el.textContent = `${len} / 280`;
  el.className = len > 260 ? (len > 280 ? 'char-count over' : 'char-count warn') : 'char-count';
  btn.disabled = len === 0 || len > 280;
}

function formatTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60)   return `${diff}秒前`;
  if (diff < 3600) return `${Math.floor(diff/60)}分前`;
  if (diff < 86400)return `${Math.floor(diff/3600)}時間前`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
window.addEventListener('load', async () => {
  if (!initSupabase()) {
    document.getElementById('setup-banner').style.display = 'block';
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display  = '';
    return;
  }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session?.user) showAppScreen(session.user);
    if (event === 'SIGNED_OUT') showAuthScreen();
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) showAppScreen(session.user);
  else showAuthScreen();
});
</script>
</body>
</html>
