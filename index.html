<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひとこと</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0e0e0f; --surface: #18181b; --surface2: #222226;
      --border: #2e2e34; --accent: #7fff6e; --accent2: #6ee0ff;
      --text: #f0f0f0; --muted: #888; --danger: #ff6e6e; --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Zen Kaku Gothic New', sans-serif; min-height: 100vh; }

    /* ページ管理 */
    .page { display: none; }
    .page.active { display: block; }

    /* ── 認証画面 ── */
    #page-auth {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 24px; gap: 28px;
    }
    #page-auth.active { display: flex; }
    .auth-logo { font-size: 2.8rem; font-weight: 900; letter-spacing: -2px; }
    .auth-logo span { color: var(--accent); }
    .auth-tagline { color: var(--muted); font-size: 0.9rem; }
    .auth-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px; width: 100%; max-width: 380px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .auth-tabs { display: flex; gap: 6px; background: var(--bg); border-radius: 8px; padding: 4px; }
    .auth-tab {
      flex: 1; background: none; border: none; color: var(--muted);
      padding: 8px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: all 0.2s;
    }
    .auth-tab.active { background: var(--surface2); color: var(--text); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.78rem; color: var(--muted); font-family: 'DM Mono', monospace; }
    input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: inherit; font-size: 1rem; padding: 11px 13px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent); border: none; border-radius: 8px; color: #0a0a0a;
      cursor: pointer; font-family: inherit; font-size: 1rem; font-weight: 700;
      padding: 12px; transition: opacity 0.2s; width: 100%;
    }
    .btn-primary:hover { opacity: 0.85; }
    .msg { font-size: 0.85rem; padding: 10px 13px; border-radius: 8px; margin-top: 4px; }
    .msg.error { background: #3a1a1a; color: var(--danger); }
    .msg.success { background: #1a3a1a; color: var(--accent); }

    /* ── アプリ画面 ── */
    #page-app { display: none; flex-direction: column; min-height: 100vh; }
    #page-app.active { display: flex; }
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(14,14,15,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 0 16px; height: 54px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo { font-size: 1.3rem; font-weight: 900; letter-spacing: -1px; }
    .header-logo span { color: var(--accent); }
    .user-badge {
      display: flex; align-items: center; gap: 10px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
      color: #0a0a0a; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
    }
    .username-label { font-size: 0.85rem; color: var(--muted); }
    .btn-logout {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); cursor: pointer; font-family: 'DM Mono', monospace;
      font-size: 0.72rem; padding: 5px 10px; transition: all 0.2s;
    }
    .btn-logout:hover { color: var(--text); border-color: var(--text); }

    .feed {
      max-width: 580px; margin: 0 auto; padding: 20px 14px;
      display: flex; flex-direction: column; gap: 16px; width: 100%;
    }

    /* 投稿ボックス */
    .compose {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .compose textarea {
      background: none; border: none; color: var(--text); font-family: inherit;
      font-size: 1rem; outline: none; resize: none; width: 100%; min-height: 70px; line-height: 1.6;
    }
    .compose textarea::placeholder { color: var(--muted); }
    .compose-footer { display: flex; align-items: center; justify-content: space-between; }
    .char-count { font-family: 'DM Mono', monospace; font-size: 0.76rem; color: var(--muted); }
    .char-count.warn { color: #ffb86e; }
    .char-count.over { color: var(--danger); }
    .btn-post {
      background: var(--accent); border: none; border-radius: 8px; color: #0a0a0a;
      cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 700;
      padding: 8px 20px; transition: opacity 0.2s;
    }
    .btn-post:hover { opacity: 0.85; }
    .btn-post:disabled { opacity: 0.3; cursor: not-allowed; }

    /* 投稿カード */
    .section-label {
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      color: var(--muted); letter-spacing: 1px; text-transform: uppercase; padding: 0 2px;
    }
    .posts { display: flex; flex-direction: column; gap: 10px; }
    .post-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 15px;
      display: flex; flex-direction: column; gap: 10px;
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .post-head { display: flex; align-items: center; gap: 10px; }
    .post-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent2);
      color: #0a0a0a; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
    }
    .post-name { font-weight: 700; font-size: 0.9rem; }
    .post-time { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .post-body { font-size: 0.96rem; line-height: 1.65; word-break: break-word; white-space: pre-wrap; }
    .post-foot { display: flex; align-items: center; gap: 14px; }
    .btn-like {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-family: inherit; font-size: 0.85rem; padding: 3px 0;
      display: flex; align-items: center; gap: 5px; transition: color 0.2s;
    }
    .btn-like:hover, .btn-like.liked { color: var(--danger); }
    .btn-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.8rem; margin-left: auto; transition: color 0.2s;
    }
    .btn-del:hover { color: var(--danger); }
    .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 0.9rem; }
    .loading { text-align: center; color: var(--muted); padding: 32px; font-family: 'DM Mono', monospace; font-size: 0.8rem; }
  </style>
</head>
<body>

<!-- 認証画面 -->
<div id="page-auth" class="page">
  <div class="auth-logo">ひとこと<span>.</span></div>
  <p class="auth-tagline">友達だけの、小さなSNS</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">ログイン</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">新規登録</button>
    </div>

    <!-- ログイン -->
    <div id="form-login">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="form-group" style="margin-top:10px">
        <label>パスワード</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <div id="login-msg" style="display:none" class="msg"></div>
      <button class="btn-primary" style="margin-top:14px" onclick="doLogin()">ログイン</button>
    </div>

    <!-- 新規登録 -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" id="reg-name" placeholder="yourname" maxlength="20">
      </div>
      <div class="form-group" style="margin-top:10px">
        <label>メールアドレス</label>
        <input type="email" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="form-group" style="margin-top:10px">
        <label>パスワード（6文字以上）</label>
        <input type="password" id="reg-pass" placeholder="••••••••">
      </div>
      <div id="reg-msg" style="display:none" class="msg"></div>
      <button class="btn-primary" style="margin-top:14px" onclick="doSignup()">登録する</button>
    </div>
  </div>
</div>

<!-- アプリ画面 -->
<div id="page-app" class="page">
  <header class="app-header">
    <div class="header-logo">ひとこと<span>.</span></div>
    <div class="user-badge">
      <div class="avatar" id="hd-avatar">?</div>
      <span class="username-label" id="hd-name"></span>
      <button class="btn-logout" onclick="doLogout()">ログアウト</button>
    </div>
  </header>

  <div class="feed">
    <!-- 投稿ボックス -->
    <div class="compose">
      <textarea id="post-input" placeholder="いまどうしてる？" maxlength="280" oninput="onInput()"></textarea>
      <div class="compose-footer">
        <span class="char-count" id="char-count">0 / 280</span>
        <button class="btn-post" id="post-btn" onclick="doPost()" disabled>投稿</button>
      </div>
    </div>

    <div class="section-label">タイムライン</div>
    <div class="posts" id="posts-list">
      <div class="loading">読み込み中...</div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════
//  ここを書き換えてください
const SUPABASE_URL  = 'https://mwxszobzojshmxudkqyw.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_mmcEZBnVOux_5hQK9Nvy9g_9iF7BGeH';
// ════════════════════════════════

let sb, me;

// 初期化
window.addEventListener('load', () => {
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    showPage('app');
    document.getElementById('posts-list').innerHTML =
      '<div class="empty">⚙️ index.html の SUPABASE_URL と SUPABASE_KEY を設定してください</div>';
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  // セッション確認
  sb.auth.getSession().then(({ data }) => {
    if (data.session) {
      enterApp(data.session.user);
    } else {
      showPage('auth');
    }
  });
});

// ── ページ切り替え ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
}

function switchTab(tab) {
  document.getElementById('form-login').style.display  = tab === 'login'  ? '' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
}

// ── 認証 ──
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const msg   = document.getElementById('login-msg');
  if (!email || !pass) return showMsg(msg, 'error', 'すべて入力してください');

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return showMsg(msg, 'error', 'メールまたはパスワードが違います');
  enterApp(data.user);
}

async function doSignup() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const msg   = document.getElementById('reg-msg');
  if (!name || !email || !pass) return showMsg(msg, 'error', 'すべて入力してください');
  if (pass.length < 6) return showMsg(msg, 'error', 'パスワードは6文字以上です');

  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { username: name } }
  });
  if (error) return showMsg(msg, 'error', error.message);

  // 登録後すぐログイン試行
  const { data: loginData, error: loginErr } = await sb.auth.signInWithPassword({ email, password: pass });
  if (loginErr) {
    showMsg(msg, 'success', '登録完了！ログインタブからログインしてください');
    setTimeout(() => switchTab('login'), 1500);
  } else {
    enterApp(loginData.user);
  }
}

async function doLogout() {
  await sb.auth.signOut();
  me = null;
  showPage('auth');
}

// ── アプリ入場 ──
function enterApp(user) {
  me = user;
  const name = user.user_metadata?.username || user.email.split('@')[0];
  document.getElementById('hd-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('hd-name').textContent   = name;
  showPage('app');
  loadPosts();
  // リアルタイム購読
  sb.channel('posts-ch')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, loadPosts)
    .subscribe();
}

// ── 投稿 ──
function onInput() {
  const len = document.getElementById('post-input').value.length;
  const el  = document.getElementById('char-count');
  el.textContent = len + ' / 280';
  el.className = len > 260 ? (len > 280 ? 'char-count over' : 'char-count warn') : 'char-count';
  document.getElementById('post-btn').disabled = len === 0 || len > 280;
}

async function doPost() {
  const ta   = document.getElementById('post-input');
  const text = ta.value.trim();
  if (!text) return;
  document.getElementById('post-btn').disabled = true;
  const name = me.user_metadata?.username || me.email.split('@')[0];
  await sb.from('posts').insert({ user_id: me.id, username: name, content: text, liked_by: [] });
  ta.value = '';
  onInput();
}

async function loadPosts() {
  const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false }).limit(60);
  const list = document.getElementById('posts-list');
  if (error || !data) { list.innerHTML = '<div class="empty">読み込みに失敗しました</div>'; return; }
  if (!data.length)   { list.innerHTML = '<div class="empty">まだ投稿がありません。最初の一言をどうぞ！</div>'; return; }
  list.innerHTML = data.map(postCard).join('');
}

function postCard(p) {
  const name    = esc(p.username || '名無し');
  const initial = name.charAt(0).toUpperCase();
  const liked   = (p.liked_by || []).includes(me?.id);
  const count   = (p.liked_by || []).length;
  const isOwn   = me && p.user_id === me.id;
  return `
  <div class="post-card">
    <div class="post-head">
      <div class="post-avatar">${initial}</div>
      <div>
        <div class="post-name">${name}</div>
        <div class="post-time">${relTime(p.created_at)}</div>
      </div>
    </div>
    <div class="post-body">${esc(p.content)}</div>
    <div class="post-foot">
      <button class="btn-like ${liked ? 'liked' : ''}" onclick="toggleLike('${p.id}',${liked})">
        ${liked ? '♥' : '♡'} ${count}
      </button>
      ${isOwn ? `<button class="btn-del" onclick="delPost('${p.id}')">削除</button>` : ''}
    </div>
  </div>`;
}

async function toggleLike(id, liked) {
  const { data } = await sb.from('posts').select('liked_by').eq('id', id).single();
  let arr = data.liked_by || [];
  arr = liked ? arr.filter(x => x !== me.id) : [...new Set([...arr, me.id])];
  await sb.from('posts').update({ liked_by: arr }).eq('id', id);
  loadPosts();
}

async function delPost(id) {
  if (!confirm('削除しますか？')) return;
  await sb.from('posts').delete().eq('id', id);
  loadPosts();
}

// ── ユーティリティ ──
function showMsg(el, type, text) {
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = 'block';
}

function relTime(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60)    return s + '秒前';
  if (s < 3600)  return Math.floor(s/60) + '分前';
  if (s < 86400) return Math.floor(s/3600) + '時間前';
  const d = new Date(iso);
  return (d.getMonth()+1) + '/' + d.getDate();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
